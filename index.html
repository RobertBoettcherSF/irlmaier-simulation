/* Shared debug cover for every mockup.
   Adds an always-visible red Debug button + bright version stamp (top-right), Reload-if-newer check via root version.txt; Debug bottom-left (next to Voice),

   Other scripts: DebugCover.log(type,data), DebugCover.state(name,fn). */
(function(){

  var SRC=(document.currentScript&&document.currentScript.src)||'';

  var badge=document.createElement('div');badge.textContent='v'+APPV;badge.setAttribute('data-dbg','1');badge.title='Build version';
  badge.style.cssText=base+'top:4px;right:6px;font:bold 13px/16px monospace;padding:1px 8px;background:#ffeb3b;color:#000;border:2px solid #000;box-shadow:0 0 4px #ffeb3b;pointer-events:none';
  var rl=document.createElement('button');rl.setAttribute('data-dbg','1');
  rl.style.cssText=base+'top:32px;right:8px;display:none;cursor:pointer;font:bold 13px monospace;background:#00e676;color:#000;border:2px solid #000';
  var dbg=document.createElement('button');dbg.textContent='Debug';dbg.setAttribute('data-dbg','1');
  dbg.style.cssText=base+'bottom:10px;left:10px;cursor:pointer;background:#b3261e;color:#fff;border:1px solid #e57373;font-weight:bold';
  function place(){var v=null;document.querySelectorAll('button[data-dbg]').forEach(function(b){if(b!==dbg&&b!==rl&&/voice/i.test(b.textContent))v=b;});
    if(v){var r=v.getBoundingClientRect();dbg.style.left=Math.round(r.right+8)+'px';}}
  function cmp(a,b){a=a.split('.').map(Number);b=b.split('.').map(Number);for(var i=0;i<3;i++){if((a[i]||0)!==(b[i]||0))return (a[i]||0)-(b[i]||0);}return 0;}
  function check(){try{fetch(ROOT+'version.txt?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
    t=(t||'').trim().replace(/^v/,'');if(/^\d+\.\d+\.\d+$/.test(t)&&cmp(t,APPV)>0){rl.textContent='v'+t+' verfügbar – Neu laden';rl.style.display='block';ev('update-available',{remote:t});}
  }).catch(function(){});}catch(e){}}

  function mount(){var r=document.body||document.documentElement;r.appendChild(dbg);r.appendChild(rl);

const log=[];function L(m){log.push(new Date().toISOString()+' '+m);if(log.length>500)log.shift();try{localStorage.setItem('irl_log',JSON.stringify(log.slice(-100)))}catch(e){}}

try{if(localStorage.getItem('irl_running')==='1'){document.getElementById('crash').style.display='block'}localStorage.setItem('irl_running','1')}catch(e){}
addEventListener('beforeunload',()=>{try{localStorage.setItem('irl_running','0')}catch(e){}});
addEventListener('error',e=>L('ERROR '+e.message+' @'+e.filename+':'+e.lineno));

let screen='splash';
function start(){if(screen!=='splash')return;screen='map';L('start');DebugCover.log('screen',{to:'map'});document.getElementById('splash').style.display='none';document.getElementById('credit').style.display='none';document.getElementById('map').style.display='block';initMap().catch(e=>{L('map error '+e);DebugCover.log('map-error',{msg:String(e)})})}

addEventListener('keydown',e=>{
 if(e.key==='F9'){e.preventDefault();DebugCover.open();return}
 if((e.key===' '||e.key==='Enter')&&screen==='splash'){e.preventDefault();start()}
});
L('load v'+VERSION);DebugCover.state('app',function(){return {state:{screen:screen},appLog:log};});

function zoom(f,cx,cy){const ns=Math.max(0.5,Math.min(40,view.s*f));f=ns/view.s;view.x=cx-(cx-view.x)*f;view.y=cy-(cy-view.y)*f;view.s=ns;draw()}
